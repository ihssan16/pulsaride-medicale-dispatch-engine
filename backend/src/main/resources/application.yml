spring:
  application:
    name: pulsaride-dispatch-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulsaride}
    username: ${SPRING_DATASOURCE_USERNAME:pulsaride}
    password: ${SPRING_DATASOURCE_PASSWORD:pulsaride123}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

pulsaride:
  ai:
    mode: ${AI_PROVIDER:${AI_MODE:mock}}
    external-url: ${AI_EXTERNAL_URL:http://localhost:8000}
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
  dispatch:
    proposal-timeout-seconds: ${PULSARIDE_PROPOSAL_TIMEOUT_SECONDS:30}
    timeout-scan-ms: ${PULSARIDE_TIMEOUT_SCAN_MS:5000}
  outbox:
    publisher:
      enabled: ${PULSARIDE_OUTBOX_PUBLISHER_ENABLED:false}
      batch-size: ${PULSARIDE_OUTBOX_PUBLISHER_BATCH_SIZE:50}
      interval-ms: ${PULSARIDE_OUTBOX_PUBLISHER_INTERVAL_MS:5000}
  triage:
    consumer:
      enabled: ${PULSARIDE_TRIAGE_CONSUMER_ENABLED:false}
      topic: ${PULSARIDE_TRIAGE_TOPIC:request.triaged.v1}
      group-id: ${PULSARIDE_TRIAGE_CONSUMER_GROUP:pulsaride-dispatch}
  kafka:
    retry:
      interval-ms: ${PULSARIDE_KAFKA_RETRY_INTERVAL_MS:1000}
      max-attempts: ${PULSARIDE_KAFKA_RETRY_MAX_ATTEMPTS:3}
  seed-data:
    enabled: ${PULSARIDE_SEED_DATA:true}
    simulator-data-dir: ${PULSARIDE_SIMULATOR_DATA_DIR:../simulator/data}
