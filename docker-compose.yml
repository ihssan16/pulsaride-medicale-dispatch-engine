services:
  api:
    build:
      context: ./backend
    container_name: pulsaride-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulsaride
      SPRING_DATASOURCE_USERNAME: pulsaride
      SPRING_DATASOURCE_PASSWORD: pulsaride123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PULSARIDE_OUTBOX_PUBLISHER_ENABLED: "true"
      PULSARIDE_TRIAGE_CONSUMER_ENABLED: "true"
      PULSARIDE_SIMULATOR_DATA_DIR: /data
      AI_MODE: ${AI_PROVIDER:-${AI_MODE:-mock}}
      AI_EXTERNAL_URL: ${AI_EXTERNAL_URL:-http://darija-ai:8000}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "8080:8080"
    volumes:
      - ./simulator/data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg15
    container_name: pulsaride-postgres
    environment:
      POSTGRES_DB: pulsaride
      POSTGRES_USER: pulsaride
      POSTGRES_PASSWORD: pulsaride123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsaride -d pulsaride"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsaride-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: pulsaride-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "cGxzcmlkZS1kaXNwYXRjaC1lbmc"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  darija-ai:
    profiles: ["ai"]
    build:
      context: ${DARIJA_HEALTH_NLP_DIR:-../darija-health-nlp}/backend
    container_name: pulsaride-darija-ai
    environment:
      TRANSFORMER_PATH: /app/models/transformer_MARBERT_specialty
    ports:
      - "8000:8000"
    volumes:
      - ${DARIJA_MODEL_DIR:-../darija-health-nlp/models}:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  kafka_data:
